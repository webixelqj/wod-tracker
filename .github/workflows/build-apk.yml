name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier Android
        run: flutter create --org be.wodtracker --project-name wod_tracker --platforms=android .

      - name: Configurer Android (Health Connect, Internet)
        run: python3 tool/patch_android.py .

      - name: Télécharger les dépendances
        run: flutter pub get

      - name: Générer l'icône
        run: dart run flutter_launcher_icons

      # Toujours la même clé de signature : chaque nouvelle version
      # s'installe par-dessus l'ancienne sans perdre tes données.
      - name: Clé de signature fixe
        run: mkdir -p ~/.android && cp tool/debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Garder l'APK dans le run
        uses: actions/upload-artifact@v4
        with:
          name: wod-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WOD Tracker – build ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
